{# Blog post template with timezone-aware dates -#}
{% extends "base.html" %}

{% block page_content %}
    <article>
        <h1>{{ title }}</h1>

        {# Published date with client-side timezone conversion #}
        {% if date %}
        <time datetime="{{ date_iso }}" data-local="true">
            {{ date.strftime("%Y-%m-%d %H:%M UTC") }}
        </time>
        {% endif %}

        <div class="content">
            {{ html_content|safe }}
        </div>
    </article>
{% endblock %}
