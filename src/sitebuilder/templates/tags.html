{% extends "base.html" %}

{% block page_header %}
    <header>
        <h1>{{ title }}</h1>
        {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
    </header>
{% endblock %}

{% block page_content %}
    <main>
        <ul>
        {% for tag, url in tags %}
            <li><a href="{{ url }}">{{ tag }}</a></li>
        {% else %}
            <li>No tags found.</li>
        {% endfor %}
        </ul>
    </main>
{% endblock %}
